name: Getaway
description: 'Getaway was a consumer hospitality startup that operated a network of
  minimalist tiny cabins ("Outposts") in nature within a couple hours'' drive of major
  US cities, letting people book short, disconnected nature escapes. Surfaced in the
  API Evangelist network as a portfolio company of cowboy-ventures (sector: consumer).
  The company was acquired by Marriott International and rebranded as "Postcard Cabins"
  under Marriott''s Outdoor Collection; the getaway.house domain now 301-redirects
  entirely to the Marriott Postcard Cabins brand page. Getaway operates a consumer
  booking website only and publishes no public developer portal, API, or documentation
  surface, so this profile carries identity metadata rather than API artifacts.'
